name: Build and publish web game

on:
  push:
    branches: [main]
    paths:
      - "source/src/**"
      - "source/web/**"
      - "source/vite.web.config.ts"
      - "source/package.json"
      - "source/package-lock.json"
      - "source/scripts/copy-web-static.mjs"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-web-game
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Build standalone web game
        working-directory: source
        run: npm run build:web
      - name: Publish generated game assets
        run: |
          cp -a source/dist-web/. web/
      - name: Commit built game
        run: |
          if git diff --quiet -- web; then
            echo "Generated web build is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          git commit -m "Build updated web game"
          git push
